name: Build DriveBox APK

on:
  push:
    branches: ["drivebox-apk-build"]
    paths:
      - "drivebox-build/**"
      - "drivebox-v11/**"
      - "drivebox-v12/**"
      - "drivebox-v13/**"
      - "drivebox-v14/**"
      - "drivebox-v20/**"
      - ".github/workflows/build-drivebox-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Assemble DriveBox base source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/drivebox-src"
          cat drivebox-build/chunks/part*.txt > "$RUNNER_TEMP/drivebox.b64"
          test "$(wc -c < "$RUNNER_TEMP/drivebox.b64" | tr -d ' ')" -eq 41284
          base64 -d "$RUNNER_TEMP/drivebox.b64" > "$RUNNER_TEMP/DriveBox_v1.0_FIXED3.zip"
          echo "64bf67814be2140925c643cf934112208beee00ac5b500d43e9afa2fe50ae085  $RUNNER_TEMP/DriveBox_v1.0_FIXED3.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/DriveBox_v1.0_FIXED3.zip" -d "$RUNNER_TEMP/drivebox-src"

      - name: Apply DriveBox v1.1 storage fix
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/drivebox-src/DriveBox_v1.0"
          cp drivebox-v11/AppConfig.kt "$ROOT/app/src/main/java/lu/guerrida/drivebox/AppConfig.kt"
          cp drivebox-v11/MainActivity.kt "$ROOT/app/src/main/java/lu/guerrida/drivebox/MainActivity.kt"
          cp drivebox-v11/StorageRepository.kt "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/StorageRepository.kt"
          cp drivebox-v11/DriveBoxHttpServer.kt "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/DriveBoxHttpServer.kt"
          cp drivebox-v11/AndroidManifest.xml "$ROOT/app/src/main/AndroidManifest.xml"
          cp drivebox-v11/app-build.gradle.kts "$ROOT/app/build.gradle.kts"

      - name: Apply DriveBox Family v1.2 base
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/drivebox-src/DriveBox_v1.0"
          cp drivebox-v12/UserManager.kt "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/UserManager.kt"
          cp drivebox-v12/AuthManager.kt "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/AuthManager.kt"
          cp drivebox-v12/DriveBoxHttpServer.kt "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/DriveBoxHttpServer.kt"
          cp drivebox-v12/index.html "$ROOT/app/src/main/assets/drivebox/index.html"
          sed -i 's/versionCode = 2/versionCode = 3/' "$ROOT/app/build.gradle.kts"
          sed -i 's/versionName = "1.1.0"/versionName = "1.2.0"/' "$ROOT/app/build.gradle.kts"

      - name: Apply DriveBox Family v1.3.2 accounts
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/drivebox-src/DriveBox_v1.0"
          cp drivebox-v13/UserManager.kt "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/UserManager.kt"
          cp drivebox-v13/AuthManager.kt "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/AuthManager.kt"
          cp drivebox-v13/MainActivity.kt "$ROOT/app/src/main/java/lu/guerrida/drivebox/MainActivity.kt"

      - name: Apply DriveBox Family v1.4.1 storage engine
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/drivebox-src/DriveBox_v1.0"
          cp drivebox-v14/StorageRepository.kt "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/StorageRepository.kt"
          sed -i 's/versionCode = 3/versionCode = 7/' "$ROOT/app/build.gradle.kts"
          sed -i 's/versionName = "1.2.0"/versionName = "1.4.1"/' "$ROOT/app/build.gradle.kts"
          grep -q 'USB_APP_SCOPED' "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/StorageRepository.kt"
          grep -q 'probeFileWrite' "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/StorageRepository.kt"

      - name: Apply DriveBox V2 Preview AI
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/drivebox-src/DriveBox_v1.0"
          cp drivebox-v20/DriveBoxHttpServer.kt "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/DriveBoxHttpServer.kt"
          cp drivebox-v20/index.html "$ROOT/app/src/main/assets/drivebox/index.html"
          sed -i 's/versionCode = 7/versionCode = 20/' "$ROOT/app/build.gradle.kts"
          sed -i 's/versionName = "1.4.1"/versionName = "2.0.0-preview"/' "$ROOT/app/build.gradle.kts"
          sed -i 's/DriveBox Family/DriveBox AI/g' "$ROOT/app/src/main/java/lu/guerrida/drivebox/MainActivity.kt"
          sed -i 's/Cloud familial privé • V1.3/Private Smart Cloud • V2 Preview/g' "$ROOT/app/src/main/java/lu/guerrida/drivebox/MainActivity.kt"
          sed -i 's/Scanner pour ouvrir DriveBox Family/Scanner pour ouvrir DriveBox AI/g' "$ROOT/app/src/main/java/lu/guerrida/drivebox/MainActivity.kt"
          grep -q 'versionName = "2.0.0-preview"' "$ROOT/app/build.gradle.kts"
          grep -q 'api/insights' "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/DriveBoxHttpServer.kt"
          grep -q 'api/ai/query' "$ROOT/app/src/main/java/lu/guerrida/drivebox/server/DriveBoxHttpServer.kt"
          grep -q 'DriveBox Intelligence' "$ROOT/app/src/main/assets/drivebox/index.html"

      - name: Build APK
        working-directory: ${{ runner.temp }}/drivebox-src/DriveBox_v1.0
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          APK="$RUNNER_TEMP/drivebox-src/DriveBox_v1.0/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/DriveBox-v2.0-Preview.apk"
          ls -lh "$RUNNER_TEMP/DriveBox-v2.0-Preview.apk"
          sha256sum "$RUNNER_TEMP/DriveBox-v2.0-Preview.apk"
          unzip -t "$RUNNER_TEMP/DriveBox-v2.0-Preview.apk" >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveBox-v2.0-Preview-APK
          path: ${{ runner.temp }}/DriveBox-v2.0-Preview.apk
          if-no-files-found: error
          retention-days: 7
