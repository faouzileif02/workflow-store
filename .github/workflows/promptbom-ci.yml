name: PromptBOM CI

on:
  push:
    paths:
      - 'agents-ia/faouzi-ai-lab/promptbom/**'
      - '.github/workflows/promptbom-ci.yml'
  pull_request:
    paths:
      - 'agents-ia/faouzi-ai-lab/promptbom/**'
      - '.github/workflows/promptbom-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    defaults:
      run:
        working-directory: agents-ia/faouzi-ai-lab/promptbom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate demo
        run: python -m promptbom validate examples/demo
      - name: Lock demo
        run: python -m promptbom lock examples/demo
      - name: Verify demo lock
        run: python -m promptbom verify examples/demo
      - name: Build reports
        run: |
          python -m promptbom report examples/demo -o /tmp/promptbom-report.md
          python -m promptbom report examples/demo --format html -o /tmp/promptbom-report.html
