<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DriveBox Family</title>
<style>
:root{--bg:#06101d;--panel:#0f1d2f;--panel2:#13243a;--line:#203a57;--text:#f5f8fc;--muted:#91a8c2;--blue:#4f8cff;--blue2:#69a0ff;--green:#34d399;--red:#fb7185;--yellow:#fbbf24;--shadow:0 24px 70px #0007}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#14345b 0,#071321 32%,#040b13 75%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.brand{display:flex;gap:14px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--blue2),#3577ef);display:grid;place-items:center;font-weight:900;box-shadow:0 8px 25px #4f8cff44}.muted{color:var(--muted)}.family{min-height:100vh;padding:42px 24px}.family-inner{max-width:1120px;margin:auto}.family-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:54px}.family-title h1{font-size:34px;margin:0 0 8px}.family-title p{margin:0;color:var(--muted)}.private-pill{border:1px solid var(--line);background:#0d1b2b;padding:10px 14px;border-radius:999px;color:#b8c9dc;font-size:13px}.profiles-title{text-align:center;margin:0 0 8px;font-size:30px}.profiles-sub{text-align:center;color:var(--muted);margin:0 0 34px}.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;max-width:900px;margin:auto}.profile-card{border:1px solid #1b3551;background:linear-gradient(160deg,#10233a,#0b1727);border-radius:24px;padding:26px 18px;min-height:190px;text-align:center;color:var(--text);box-shadow:0 12px 40px #0003;transition:.18s}.profile-card:hover,.profile-card:focus{transform:translateY(-4px);border-color:#4f8cff88;box-shadow:0 18px 45px #0005}.avatar{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:31px;font-weight:900;background:linear-gradient(145deg,#4f8cff,#8b5cf6);box-shadow:0 10px 28px #4f8cff3b}.profile-name{font-size:19px;font-weight:750}.profile-small{font-size:12px;color:var(--muted);margin-top:6px}.add-card{border-style:dashed;background:#0a1625}.add-card .avatar{background:#142b46;border:1px dashed #4f8cff;color:#72a5ff;font-size:42px;font-weight:300}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:22px;padding:34px;text-align:center;color:var(--muted)}.modal-wrap{position:fixed;inset:0;background:#02070dcf;display:grid;place-items:center;padding:20px;z-index:50}.modal{width:min(460px,100%);background:#101f32;border:1px solid #24415f;border-radius:25px;padding:28px;box-shadow:var(--shadow)}.modal h2{margin:5px 0 8px}.modal p{color:var(--muted);line-height:1.5}.field{margin:15px 0}.field label{display:block;font-size:13px;color:#aec1d6;margin:0 0 7px}.field input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid #29435f;background:#071422;color:#fff;outline:none}.field input:focus{border-color:var(--blue)}.row{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:13px;padding:13px 17px;background:var(--blue);color:white;font-weight:700}.btn.secondary{background:#12263d;border:1px solid #294761;color:#dce8f4}.btn.danger{background:#8f2440}.btn.wide{width:100%}.msg{min-height:20px;margin-top:12px;font-size:13px}.msg.error{color:#ff8ca1}.msg.ok{color:#60e0ae}.close{float:right;border:0;background:#162a42;color:#c4d4e4;width:36px;height:36px;border-radius:12px}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#071321e8;border-right:1px solid #182d43;padding:22px 18px;position:sticky;top:0;height:100vh}.sidebar .brand{margin-bottom:34px}.navbtn{width:100%;text-align:left;padding:12px 13px;border:0;border-radius:12px;background:transparent;color:#b6c8da;margin:4px 0}.navbtn.active,.navbtn:hover{background:#112640;color:white}.side-bottom{position:absolute;left:18px;right:18px;bottom:20px}.main{min-width:0}.topbar{height:80px;border-bottom:1px solid #172b40;display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;background:#071321e8;backdrop-filter:blur(12px);z-index:10}.search{flex:1;max-width:620px;background:#0d1d2f;border:1px solid #1e3853;border-radius:14px;padding:12px 15px;color:white;outline:none}.user-chip{display:flex;align-items:center;gap:9px;padding:7px 11px;border:1px solid #223c57;border-radius:999px;background:#0e1e30}.mini-avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#4f8cff;font-weight:800}.content{padding:28px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.toolbar h2{margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap}.crumbs{margin:18px 0;color:#9db2c8;font-size:14px}.crumb{border:0;background:transparent;color:#9fc1ef;padding:3px}.summary{display:flex;gap:12px;margin:18px 0}.stat{background:#0d1c2d;border:1px solid #1a344e;border-radius:15px;padding:12px 15px;color:#b7c9dc}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.file-card{background:#0e1e30;border:1px solid #1a354f;border-radius:18px;padding:16px;min-height:148px;display:flex;flex-direction:column;transition:.15s}.file-card:hover{border-color:#3e6ea8;transform:translateY(-2px)}.file-icon{font-size:35px;margin-bottom:12px}.file-name{font-weight:700;word-break:break-word;line-height:1.25}.file-meta{font-size:12px;color:var(--muted);margin-top:6px}.file-actions{display:flex;gap:6px;margin-top:auto;padding-top:13px}.iconbtn{border:1px solid #28445f;background:#10243a;color:#d8e5f2;border-radius:10px;padding:7px 9px}.emptyfiles{grid-column:1/-1;padding:60px 20px;border:1px dashed #1d3a56;border-radius:20px;text-align:center;color:var(--muted)}.preview-box{width:min(980px,96vw);height:min(760px,90vh);background:#081522;border:1px solid #24425f;border-radius:20px;padding:14px;display:flex;flex-direction:column}.preview-head{display:flex;justify-content:space-between;align-items:center;padding:5px 5px 12px}.preview-body{flex:1;min-height:0;display:grid;place-items:center;background:#03080e;border-radius:14px;overflow:hidden}.preview-body img,.preview-body video{max-width:100%;max-height:100%}.preview-body iframe{width:100%;height:100%;border:0;background:white}.preview-body audio{width:min(600px,90%)}#uploadInput{display:none}@media(max-width:760px){.family{padding:24px 14px}.family-head{margin-bottom:35px}.private-pill{display:none}.profiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.profile-card{min-height:160px;padding:20px 10px}.avatar{width:68px;height:68px}.app{display:block}.sidebar{display:none}.topbar{height:auto;padding:12px;flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}.content{padding:18px 12px}.file-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.file-card{min-height:145px}.user-chip span:last-child{display:none}}
</style>
</head>
<body>
<section id="familyView" class="family">
 <div class="family-inner">
  <div class="family-head">
   <div class="brand"><div class="logo">DB</div><div class="family-title"><h1>DriveBox Family</h1><p>Notre cloud familial privé</p></div></div>
   <div class="private-pill">🔒 Réseau familial privé · V1.3</div>
  </div>
  <h2 class="profiles-title">Qui utilise DriveBox ?</h2>
  <p class="profiles-sub">Choisis ton profil et entre ton mot de passe.</p>
  <div id="profiles" class="profiles"><div class="empty">Chargement des profils…</div></div>
 </div>
</section>

<section id="appView" class="app hidden">
 <aside class="sidebar">
  <div class="brand"><div class="logo">DB</div><div><strong>DriveBox</strong><div class="muted" style="font-size:12px">Family V1.3</div></div></div>
  <button class="navbtn active" onclick="goRoot()">🏠 Mon espace</button>
  <button class="navbtn" onclick="document.getElementById('uploadInput').click()">⬆️ Importer</button>
  <button class="navbtn" onclick="createFolder()">📁 Nouveau dossier</button>
  <div class="side-bottom"><button class="navbtn" onclick="openPassword()">⚙️ Mon profil</button><button class="navbtn" onclick="logout()">↩ Déconnexion</button></div>
 </aside>
 <main class="main">
  <header class="topbar">
   <button class="iconbtn" onclick="logout()" title="Retour famille">👨‍👩‍👧‍👦</button>
   <input id="search" class="search" placeholder="Rechercher dans ce dossier…">
   <div class="user-chip"><div id="miniAvatar" class="mini-avatar">U</div><span id="userName">Membre</span></div>
  </header>
  <div class="content">
   <div class="toolbar"><div><h2 id="pageTitle">Mon espace</h2><div class="muted" id="welcome">Espace personnel</div></div><div class="actions"><button class="btn secondary" onclick="createFolder()">＋ Dossier</button><button class="btn" onclick="document.getElementById('uploadInput').click()">⬆ Importer</button></div></div>
   <div id="crumbs" class="crumbs"></div>
   <div class="summary"><div id="countStat" class="stat">0 élément</div><div id="sizeStat" class="stat">0 octet</div></div>
   <div id="files" class="file-grid"></div>
  </div>
 </main>
 <input id="uploadInput" type="file" multiple>
</section>

<div id="modalWrap" class="modal-wrap hidden"><div id="modal" class="modal"></div></div>
<div id="previewWrap" class="modal-wrap hidden"><div class="preview-box"><div class="preview-head"><strong id="previewName">Aperçu</strong><button class="close" onclick="closePreview()">✕</button></div><div id="previewBody" class="preview-body"></div></div></div>

<script>
let token=sessionStorage.getItem('drivebox_token')||'';let currentUser=null;let currentPath='';let allItems=[];let selectedProfile=null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function authHeaders(extra={}){return {...extra,...(token?{'Authorization':'Bearer '+token}:{})}}
async function req(url,opt={}){opt.headers=authHeaders(opt.headers||{});let r=await fetch(url,opt);let text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={error:text||'Erreur serveur'}}if(!r.ok)throw new Error(data.error||'Erreur '+r.status);return data}
async function jsonPost(url,obj){return req(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)})}
function showModal(html){$('#modal').innerHTML=html;$('#modalWrap').classList.remove('hidden')}
function closeModal(){$('#modalWrap').classList.add('hidden');$('#modal').innerHTML=''}
$('#modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});
async function loadProfiles(){try{let d=await req('/api/family/profiles');renderProfiles(d.profiles||[],d.storageReady)}catch(e){$('#profiles').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderProfiles(list,storageReady){let box=$('#profiles');box.innerHTML='';if(!list.length){box.innerHTML='<div class="empty">Aucun membre pour le moment.<br>Utilise le bouton <b>+</b> pour créer le premier profil.</div>'}list.forEach((p,i)=>{let b=document.createElement('button');b.className='profile-card';b.innerHTML='<div class="avatar" style="background:'+avatarGradient(i)+'">'+esc(p.initial||p.displayName?.[0]||'U')+'</div><div class="profile-name">'+esc(p.displayName)+'</div><div class="profile-small">Espace privé</div>';b.onclick=()=>openLogin(p);box.appendChild(b)});let add=document.createElement('button');add.className='profile-card add-card';add.innerHTML='<div class="avatar">＋</div><div class="profile-name">Ajouter un membre</div><div class="profile-small">Nom + mot de passe</div>';add.onclick=openCreate;box.appendChild(add);if(!storageReady){let n=document.createElement('div');n.className='empty';n.innerHTML='⚠️ Le stockage USB/SSD doit être choisi sur le receiver avant d’utiliser les fichiers.';box.appendChild(n)}}
function avatarGradient(i){let a=['linear-gradient(145deg,#4f8cff,#8b5cf6)','linear-gradient(145deg,#06b6d4,#3b82f6)','linear-gradient(145deg,#f59e0b,#ef4444)','linear-gradient(145deg,#10b981,#14b8a6)','linear-gradient(145deg,#ec4899,#8b5cf6)'];return a[i%a.length]}
function openLogin(p){selectedProfile=p;showModal('<button class="close" onclick="closeModal()">✕</button><div class="avatar" style="width:68px;height:68px;margin:0 0 14px">'+esc(p.initial||p.displayName?.[0]||'U')+'</div><h2>Bienvenue '+esc(p.displayName)+'</h2><p>Entre ton mot de passe pour ouvrir ton espace personnel.</p><form id="loginForm"><div class="field"><label>Mot de passe</label><input id="loginPass" type="password" autocomplete="current-password" autofocus required></div><button class="btn wide" type="submit">Ouvrir mon espace</button><div id="loginMsg" class="msg"></div></form>');$('#loginForm').onsubmit=async e=>{e.preventDefault();let m=$('#loginMsg');m.textContent='Connexion…';m.className='msg';try{let d=await jsonPost('/api/login',{memberId:p.id,password:$('#loginPass').value});token=d.token;sessionStorage.setItem('drivebox_token',token);closeModal();await enterApp(d.user)}catch(err){m.textContent=err.message;m.className='msg error'}}}
function openCreate(){showModal('<button class="close" onclick="closeModal()">✕</button><div class="logo" style="margin-bottom:14px">＋</div><h2>Nouveau membre</h2><p>Chaque membre possède son propre espace de stockage séparé.</p><form id="createForm"><div class="field"><label>Prénom / nom</label><input id="newName" maxlength="60" autocomplete="name" required placeholder="Ex. Ines"></div><div class="field"><label>Mot de passe</label><input id="newPass" type="password" minlength="6" required></div><div class="field"><label>Confirmer le mot de passe</label><input id="newConfirm" type="password" minlength="6" required></div><button class="btn wide" type="submit">Créer mon espace</button><div id="createMsg" class="msg"></div></form>');$('#createForm').onsubmit=async e=>{e.preventDefault();let m=$('#createMsg');let pass=$('#newPass').value,conf=$('#newConfirm').value;if(pass!==conf){m.textContent='Les mots de passe ne correspondent pas';m.className='msg error';return}m.textContent='Création…';m.className='msg';try{let d=await jsonPost('/api/family/create',{displayName:$('#newName').value,password:pass,confirm:conf});token=d.token;sessionStorage.setItem('drivebox_token',token);closeModal();await enterApp(d.user)}catch(err){m.textContent=err.message;m.className='msg error'}}}
async function restore(){if(!token){loadProfiles();return}try{let d=await req('/api/status');await enterApp(d.user,false)}catch{sessionStorage.removeItem('drivebox_token');token='';loadProfiles()}}
async function enterApp(user,load=true){currentUser=user;$('#familyView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#userName').textContent=user.displayName;$('#miniAvatar').textContent=(user.displayName||'U')[0].toUpperCase();$('#welcome').textContent='Bonjour '+user.displayName+' · ton stockage privé';currentPath='';if(load)await loadFiles();else await loadFiles()}
async function logout(){try{if(token)await jsonPost('/api/logout',{})}catch{}token='';currentUser=null;sessionStorage.removeItem('drivebox_token');$('#appView').classList.add('hidden');$('#familyView').classList.remove('hidden');currentPath='';loadProfiles()}
function goRoot(){currentPath='';loadFiles()}
async function loadFiles(path=currentPath){currentPath=path;try{let d=await req('/api/list?path='+encodeURIComponent(currentPath));allItems=d.items||[];renderCrumbs();renderFiles(allItems);$('#pageTitle').textContent=currentPath?currentPath.split('/').pop():'Mon espace';let total=allItems.reduce((n,x)=>n+(x.directory?0:Number(x.size||0)),0);$('#countStat').textContent=allItems.length+' élément'+(allItems.length>1?'s':'');$('#sizeStat').textContent=formatSize(total)}catch(e){$('#files').innerHTML='<div class="emptyfiles">'+esc(e.message)+'</div>'}}
function renderCrumbs(){let parts=currentPath?currentPath.split('/'):[];let html='<button class="crumb" onclick="goRoot()">Mon espace</button>';let acc='';parts.forEach(p=>{acc=acc?acc+'/'+p:p;html+=' <span>›</span> <button class="crumb" data-path="'+esc(acc)+'">'+esc(p)+'</button>'});$('#crumbs').innerHTML=html;document.querySelectorAll('.crumb[data-path]').forEach(b=>b.onclick=()=>loadFiles(b.dataset.path))}
function iconFor(x){if(x.directory)return'📁';let m=x.mime||'';if(m.startsWith('image/'))return'🖼️';if(m.startsWith('video/'))return'🎬';if(m.startsWith('audio/'))return'🎵';if(m==='application/pdf')return'📕';return'📄'}
function renderFiles(items){let q=$('#search').value.trim().toLowerCase();let list=items.filter(x=>!q||String(x.name).toLowerCase().includes(q));let box=$('#files');box.innerHTML='';if(!list.length){box.innerHTML='<div class="emptyfiles">'+(q?'Aucun résultat':'Ce dossier est vide.<br>Importe un fichier ou crée un dossier.')+'</div>';return}list.forEach(x=>{let c=document.createElement('div');c.className='file-card';let primary=x.directory?'Ouvrir':'Aperçu';c.innerHTML='<div class="file-icon">'+iconFor(x)+'</div><div class="file-name" title="'+esc(x.name)+'">'+esc(x.name)+'</div><div class="file-meta">'+(x.directory?'Dossier':formatSize(x.size))+(x.modified?' · '+formatDate(x.modified):'')+'</div><div class="file-actions"><button class="iconbtn primary">'+primary+'</button><button class="iconbtn rename" title="Renommer">✏️</button><button class="iconbtn del" title="Supprimer">🗑️</button></div>';c.querySelector('.primary').onclick=()=>x.directory?loadFiles(x.path):previewFile(x);c.querySelector('.rename').onclick=()=>renameItem(x);c.querySelector('.del').onclick=()=>deleteItem(x);if(x.directory)c.ondblclick=()=>loadFiles(x.path);box.appendChild(c)})}
$('#search').addEventListener('input',()=>renderFiles(allItems));
async function createFolder(){let name=prompt('Nom du nouveau dossier :');if(!name)return;try{await jsonPost('/api/mkdir',{path:currentPath,name});await loadFiles()}catch(e){alert(e.message)}}
async function renameItem(x){let name=prompt('Nouveau nom :',x.name);if(!name||name===x.name)return;try{await jsonPost('/api/rename',{path:x.path,name});await loadFiles()}catch(e){alert(e.message)}}
async function deleteItem(x){if(!confirm('Supprimer « '+x.name+' » ?'))return;try{await jsonPost('/api/delete',{path:x.path});await loadFiles()}catch(e){alert(e.message)}}
$('#uploadInput').addEventListener('change',async e=>{let files=[...e.target.files];if(!files.length)return;for(let f of files){let fd=new FormData();fd.append('file',f,f.name);fd.append('path',currentPath);try{let r=await fetch('/api/upload',{method:'POST',headers:authHeaders(),body:fd});let d=await r.json();if(!r.ok)throw new Error(d.error||'Upload impossible')}catch(err){alert('Erreur '+f.name+' : '+err.message);break}}e.target.value='';await loadFiles()});
function fileUrl(x,download=false){return'/api/download?path='+encodeURIComponent(x.path)+'&token='+encodeURIComponent(token)+(download?'&download=1':'')}
function previewFile(x){let mime=x.mime||'';let url=fileUrl(x,false);$('#previewName').textContent=x.name;let h='';if(mime.startsWith('image/'))h='<img src="'+url+'" alt="">';else if(mime.startsWith('video/'))h='<video src="'+url+'" controls autoplay></video>';else if(mime.startsWith('audio/'))h='<audio src="'+url+'" controls autoplay></audio>';else if(mime==='application/pdf')h='<iframe src="'+url+'"></iframe>';else{location.href=fileUrl(x,true);return}$('#previewBody').innerHTML=h;$('#previewWrap').classList.remove('hidden')}
function closePreview(){$('#previewWrap').classList.add('hidden');$('#previewBody').innerHTML=''}
function openPassword(){showModal('<button class="close" onclick="closeModal()">✕</button><h2>Mon profil</h2><p>'+esc(currentUser?.displayName||'')+' · changer mon mot de passe</p><form id="passForm"><div class="field"><label>Mot de passe actuel</label><input id="oldPass" type="password" required></div><div class="field"><label>Nouveau mot de passe</label><input id="newPass2" type="password" minlength="6" required></div><div class="field"><label>Confirmer</label><input id="newPass3" type="password" minlength="6" required></div><button class="btn wide" type="submit">Changer le mot de passe</button><div id="passMsg" class="msg"></div></form>');$('#passForm').onsubmit=async e=>{e.preventDefault();let m=$('#passMsg');try{await jsonPost('/api/profile/password',{currentPassword:$('#oldPass').value,newPassword:$('#newPass2').value,confirm:$('#newPass3').value});m.textContent='Mot de passe modifié. Reconnexion…';m.className='msg ok';setTimeout(()=>logout(),900)}catch(err){m.textContent=err.message;m.className='msg error'}}}
function formatSize(n){n=Number(n||0);if(n<1024)return n+' o';let u=['Ko','Mo','Go','To'],i=-1;do{n/=1024;i++}while(n>=1024&&i<u.length-1);return n.toFixed(n<10?1:0)+' '+u[i]}
function formatDate(v){try{return new Date(Number(v)).toLocaleDateString('fr-FR')}catch{return''}}
restore();
</script>
</body>
</html>
