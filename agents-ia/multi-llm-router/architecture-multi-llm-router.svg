<text x="65" y="505" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#55cfff">Groq → erreur ? Mistral → erreur ? GLM/Z.AI → erreur ? Gemini</text>
<text x="65" y="555" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#9fb6d8">La première réponse valide est renvoyée au client avec le fournisseur et le modèle utilisés.</text>
