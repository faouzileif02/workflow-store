name: PromptBOM CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate demo
        run: promptbom validate examples/demo
      - name: Read-only scan leaves no output file
        run: |
          cp -R examples/demo /tmp/promptbom-readonly-demo
          rm -f /tmp/promptbom-readonly-demo/promptbom.json
          promptbom scan /tmp/promptbom-readonly-demo --no-write
          test ! -e /tmp/promptbom-readonly-demo/promptbom.json
      - name: Build and validate Claude Skill
        run: |
          python tools/build_claude_skill.py --output /tmp/promptbom-claude-skill.zip
          python -c "import zipfile; z=zipfile.ZipFile('/tmp/promptbom-claude-skill.zip'); s=[n for n in z.namelist() if n.endswith('SKILL.md')]; assert s == ['promptbom/SKILL.md'], s"
      - name: Verify demo lock
        run: promptbom verify examples/demo
      - name: Build reports
        run: |
          promptbom report examples/demo -o /tmp/promptbom-report.md
          promptbom report examples/demo --format html -o /tmp/promptbom-report.html
