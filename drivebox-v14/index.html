<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DriveBox Family</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111e;color:#f4f7fb;font-family:Arial,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}.hidden{display:none!important}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:35px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:15px;background:#4f8cff;display:grid;place-items:center;font-weight:900}.muted{color:#90a6bd}.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}.profile{border:1px solid #203a56;background:#0f2033;color:white;border-radius:20px;padding:24px 14px;min-height:160px;text-align:center}.avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 13px;background:#4f8cff;display:grid;place-items:center;font-size:28px;font-weight:800}.plus .avatar{background:#152d49;font-size:38px}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{border-right:1px solid #193047;background:#081522;padding:20px;position:sticky;top:0;height:100vh}.nav{width:100%;border:0;background:transparent;color:#bfd0df;text-align:left;padding:12px;border-radius:10px;margin:3px 0}.nav:hover{background:#10263d;color:white}.main{min-width:0}.top{padding:16px 22px;border-bottom:1px solid #193047;display:flex;gap:12px;align-items:center;position:sticky;top:0;background:#081522ee;z-index:5}.search{flex:1;border:1px solid #244561;background:#0d1d2d;color:white;border-radius:12px;padding:11px}.content{padding:22px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;background:#4f8cff;color:white;border-radius:11px;padding:11px 14px;font-weight:700}.btn.alt{background:#142b44;border:1px solid #2a4a68}.btn.danger{background:#a92f49}.status{margin:16px 0;padding:12px 14px;border:1px solid #24445f;background:#0d1e30;border-radius:12px}.status.ok{border-color:#235d4b}.status.warn{border-color:#795f24}.crumbs{margin:14px 0;color:#9eb6cb}.crumb{background:none;border:0;color:#8dbbff;padding:3px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.card{background:#0f2032;border:1px solid #1d3954;border-radius:16px;padding:15px;min-height:145px;display:flex;flex-direction:column}.icon{font-size:32px}.name{font-weight:700;margin:9px 0 4px;word-break:break-word}.meta{font-size:12px;color:#8fa6bb}.card-actions{margin-top:auto;padding-top:12px;display:flex;gap:5px;flex-wrap:wrap}.small{border:1px solid #284865;background:#11283e;color:white;border-radius:9px;padding:7px 9px}.empty{grid-column:1/-1;text-align:center;border:1px dashed #28445e;border-radius:15px;padding:35px;color:#90a7bb}.overlay{position:fixed;inset:0;background:#02070dcc;display:grid;place-items:center;padding:16px;z-index:30}.modal{width:min(440px,100%);background:#102134;border:1px solid #2a4a68;border-radius:20px;padding:22px}.modal input{width:100%;border:1px solid #31506c;background:#081522;color:white;border-radius:10px;padding:12px;margin:6px 0 12px}.modal-actions{display:flex;gap:8px;justify-content:flex-end}.msg{margin-top:10px;min-height:18px}.err{color:#ff95a9}.good{color:#63e6b5}.toast{position:fixed;right:18px;bottom:18px;background:#132b43;border:1px solid #31536f;padding:12px 15px;border-radius:11px;z-index:50;max-width:340px}.preview{width:min(950px,96vw);height:min(750px,90vh);background:#07131f;border:1px solid #294a67;border-radius:18px;padding:12px;display:flex;flex-direction:column}.previewBody{flex:1;min-height:0;display:grid;place-items:center;background:#02060a;border-radius:12px;overflow:hidden}.previewBody img,.previewBody video{max-width:100%;max-height:100%}.previewBody iframe{width:100%;height:100%;border:0;background:white}.previewBody audio{width:min(600px,90%)}#fileInput{display:none}@media(max-width:760px){.app{display:block}.side{display:none}.top{flex-wrap:wrap}.search{order:3;flex-basis:100%}.content{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.profiles{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:20px 12px}}
</style>
</head>
<body>
<section id="family"><div class="wrap"><div class="head"><div class="brand"><div class="logo">DB</div><div><h1 style="margin:0">DriveBox Family</h1><div class="muted">Cloud familial privé · V1.4</div></div></div></div><h2>Qui utilise DriveBox ?</h2><p class="muted">Choisis ton profil.</p><div id="profiles" class="profiles"></div></div></section>
<section id="app" class="app hidden"><aside class="side"><div class="brand" style="margin-bottom:25px"><div class="logo">DB</div><strong>DriveBox</strong></div><button class="nav" onclick="goRoot()">🏠 Mon espace</button><button class="nav" onclick="openFolderModal()">📁 Nouveau dossier</button><button class="nav" onclick="pickFiles()">⬆️ Importer</button><div style="position:absolute;bottom:18px;left:20px;right:20px"><button class="nav" onclick="openPasswordModal()">⚙️ Mot de passe</button><button class="nav" onclick="logout()">↩ Déconnexion</button></div></aside><main class="main"><header class="top"><button class="small" onclick="logout()">👨‍👩‍👧‍👦</button><input id="search" class="search" placeholder="Rechercher…"><strong id="memberName"></strong></header><div class="content"><div class="toolbar"><div><h2 id="title" style="margin:0">Mon espace</h2><div id="hello" class="muted"></div></div><div class="actions"><button class="btn alt" onclick="openFolderModal()">＋ Dossier</button><button class="btn" onclick="pickFiles()">⬆ Importer</button></div></div><div id="storageStatus" class="status"></div><div id="crumbs" class="crumbs"></div><div id="files" class="grid"></div></div></main><input id="fileInput" type="file" multiple></section>
<div id="overlay" class="overlay hidden"><div id="modal" class="modal"></div></div>
<div id="previewOverlay" class="overlay hidden"><div class="preview"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><strong id="previewName"></strong><button class="small" onclick="closePreview()">✕</button></div><div id="previewBody" class="previewBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
var token=sessionStorage.getItem('db_token')||'';var user=null;var currentPath='';var items=[];
function $(s){return document.querySelector(s)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function headers(extra){var h=extra||{};if(token)h['Authorization']='Bearer '+token;return h}
async function request(url,opt){opt=opt||{};opt.headers=headers(opt.headers||{});var r=await fetch(url,opt);var t=await r.text();var d={};try{d=t?JSON.parse(t):{}}catch(e){d={error:t||'Erreur serveur'}}if(!r.ok)throw new Error(d.error||('Erreur '+r.status));return d}
async function post(url,obj){return request(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)})}
function toast(text,bad){var t=$('#toast');t.textContent=text;t.style.borderColor=bad?'#8f3347':'#31536f';t.classList.remove('hidden');setTimeout(function(){t.classList.add('hidden')},2600)}
function showModal(html){$('#modal').innerHTML=html;$('#overlay').classList.remove('hidden')}
function closeModal(){$('#overlay').classList.add('hidden');$('#modal').innerHTML=''}
$('#overlay').addEventListener('click',function(e){if(e.target.id==='overlay')closeModal()})
async function loadProfiles(){try{var d=await request('/api/family/profiles');var box=$('#profiles');box.innerHTML='';(d.profiles||[]).forEach(function(p,i){var b=document.createElement('button');b.className='profile';b.innerHTML='<div class="avatar">'+esc(p.initial||p.displayName.charAt(0))+'</div><strong>'+esc(p.displayName)+'</strong><div class="muted" style="margin-top:5px">Espace privé</div>';b.onclick=function(){openLogin(p)};box.appendChild(b)});var add=document.createElement('button');add.className='profile plus';add.innerHTML='<div class="avatar">＋</div><strong>Ajouter un membre</strong>';add.onclick=openCreate;box.appendChild(add)}catch(e){toast(e.message,true)}}
function openLogin(p){showModal('<h2>'+esc(p.displayName)+'</h2><p class="muted">Entre ton mot de passe.</p><form id="loginForm"><label>Mot de passe</label><input id="loginPassword" type="password" minlength="6" required><button class="btn" style="width:100%" type="submit">Ouvrir mon espace</button><div id="mmsg" class="msg"></div></form><div class="modal-actions" style="margin-top:10px"><button class="btn alt" onclick="closeModal()">Annuler</button></div>');$('#loginForm').onsubmit=async function(e){e.preventDefault();var m=$('#mmsg');m.textContent='Connexion…';try{var d=await post('/api/login',{memberId:p.id,password:$('#loginPassword').value});token=d.token;sessionStorage.setItem('db_token',token);closeModal();await enter(d.user,d.storage,d.storageWarning)}catch(x){m.textContent=x.message;m.className='msg err'}}}
function openCreate(){showModal('<h2>Nouveau membre</h2><form id="createForm"><label>Nom</label><input id="newName" required maxlength="60"><label>Mot de passe</label><input id="newPass" type="password" minlength="6" required><label>Confirmer</label><input id="newPass2" type="password" minlength="6" required><button class="btn" style="width:100%" type="submit">Créer mon espace</button><div id="mmsg" class="msg"></div></form><div class="modal-actions" style="margin-top:10px"><button class="btn alt" onclick="closeModal()">Annuler</button></div>');$('#createForm').onsubmit=async function(e){e.preventDefault();var p=$('#newPass').value,c=$('#newPass2').value,m=$('#mmsg');if(p!==c){m.textContent='Les mots de passe ne correspondent pas';m.className='msg err';return}try{var d=await post('/api/family/create',{displayName:$('#newName').value,password:p,confirm:c});token=d.token;sessionStorage.setItem('db_token',token);closeModal();await enter(d.user,d.storage,d.storageWarning)}catch(x){m.textContent=x.message;m.className='msg err'}}}
async function restore(){if(!token){loadProfiles();return}try{var d=await request('/api/status');await enter(d.user,d.storage,d.storageWarning)}catch(e){token='';sessionStorage.removeItem('db_token');loadProfiles()}}
async function enter(u,storage,warning){user=u;$('#family').classList.add('hidden');$('#app').classList.remove('hidden');$('#memberName').textContent=u.displayName;$('#hello').textContent='Bonjour '+u.displayName+' · espace personnel';setStorage(storage,warning);currentPath='';await loadFiles('')}
function setStorage(s,w){var b=$('#storageStatus');if(!s){b.textContent='Stockage : état inconnu';b.className='status warn';return}var txt='Stockage : '+(s.label||s.mode);if(s.fallback)txt+=' · mode interne de secours';if(w)txt+=' · '+w;b.textContent=txt;b.className='status '+(s.writable?'ok':'warn')}
async function refreshStatus(){try{var s=await request('/api/storage/status');setStorage(s,null)}catch(e){}}
async function logout(){try{if(token)await post('/api/logout',{})}catch(e){}token='';user=null;sessionStorage.removeItem('db_token');$('#app').classList.add('hidden');$('#family').classList.remove('hidden');loadProfiles()}
function goRoot(){loadFiles('')}
async function loadFiles(path){currentPath=path||'';try{var d=await request('/api/list?path='+encodeURIComponent(currentPath));items=d.items||[];renderCrumbs();renderFiles(items);if(d.storage)setStorage(d.storage,null);$('#title').textContent=currentPath?currentPath.split('/').pop():'Mon espace'}catch(e){$('#files').innerHTML='<div class="empty">'+esc(e.message)+'</div>';toast(e.message,true)}}
function renderCrumbs(){var parts=currentPath?currentPath.split('/'):[];var html='<button class="crumb" onclick="goRoot()">Mon espace</button>';var acc='';for(var i=0;i<parts.length;i++){acc=acc?acc+'/'+parts[i]:parts[i];html+=' › <button class="crumb" data-path="'+esc(acc)+'">'+esc(parts[i])+'</button>'}$('#crumbs').innerHTML=html;document.querySelectorAll('.crumb[data-path]').forEach(function(b){b.onclick=function(){loadFiles(b.getAttribute('data-path'))}})}
function icon(x){if(x.directory)return'📁';var m=x.mime||'';if(m.indexOf('image/')===0)return'🖼️';if(m.indexOf('video/')===0)return'🎬';if(m.indexOf('audio/')===0)return'🎵';if(m==='application/pdf')return'📕';return'📄'}
function renderFiles(list){var q=$('#search').value.toLowerCase().trim();var box=$('#files');box.innerHTML='';var shown=list.filter(function(x){return !q||String(x.name).toLowerCase().indexOf(q)>=0});if(!shown.length){box.innerHTML='<div class="empty">Ce dossier est vide.</div>';return}shown.forEach(function(x){var c=document.createElement('div');c.className='card';c.innerHTML='<div class="icon">'+icon(x)+'</div><div class="name">'+esc(x.name)+'</div><div class="meta">'+(x.directory?'Dossier':formatSize(x.size))+'</div><div class="card-actions"><button class="small open">'+(x.directory?'Ouvrir':'Aperçu')+'</button><button class="small rename">✏️</button><button class="small del">🗑️</button></div>';c.querySelector('.open').onclick=function(){x.directory?loadFiles(x.path):preview(x)};c.querySelector('.rename').onclick=function(){openRenameModal(x)};c.querySelector('.del').onclick=function(){openDeleteModal(x)};box.appendChild(c)})}
$('#search').addEventListener('input',function(){renderFiles(items)})
function openFolderModal(){showModal('<h2>Nouveau dossier</h2><form id="folderForm"><label>Nom du dossier</label><input id="folderName" required maxlength="100"><button class="btn" style="width:100%" type="submit">Créer</button><div id="mmsg" class="msg"></div></form><div class="modal-actions" style="margin-top:10px"><button class="btn alt" onclick="closeModal()">Annuler</button></div>');$('#folderForm').onsubmit=async function(e){e.preventDefault();var m=$('#mmsg');try{await post('/api/mkdir',{path:currentPath,name:$('#folderName').value});closeModal();toast('Dossier créé');await loadFiles(currentPath)}catch(x){m.textContent=x.message;m.className='msg err'}}}
function openRenameModal(x){showModal('<h2>Renommer</h2><form id="renameForm"><label>Nouveau nom</label><input id="renameName" required value="'+esc(x.name)+'"><button class="btn" style="width:100%" type="submit">Renommer</button><div id="mmsg" class="msg"></div></form><div class="modal-actions" style="margin-top:10px"><button class="btn alt" onclick="closeModal()">Annuler</button></div>');$('#renameForm').onsubmit=async function(e){e.preventDefault();var m=$('#mmsg');try{await post('/api/rename',{path:x.path,name:$('#renameName').value});closeModal();toast('Renommé');await loadFiles(currentPath)}catch(z){m.textContent=z.message;m.className='msg err'}}}
function openDeleteModal(x){showModal('<h2>Supprimer</h2><p>Supprimer <b>'+esc(x.name)+'</b> ?</p><div class="modal-actions"><button class="btn alt" onclick="closeModal()">Annuler</button><button id="confirmDelete" class="btn danger">Supprimer</button></div><div id="mmsg" class="msg"></div>');$('#confirmDelete').onclick=async function(){var m=$('#mmsg');try{await post('/api/delete',{path:x.path});closeModal();toast('Supprimé');await loadFiles(currentPath)}catch(z){m.textContent=z.message;m.className='msg err'}}}
function pickFiles(){$('#fileInput').click()}
$('#fileInput').addEventListener('change',async function(e){var fs=Array.prototype.slice.call(e.target.files);for(var i=0;i<fs.length;i++){var f=fs[i],fd=new FormData();fd.append('file',f,f.name);fd.append('path',currentPath);try{var r=await fetch('/api/upload',{method:'POST',headers:headers({'x-file-name':f.name,'x-file-type':f.type||'application/octet-stream'}),body:fd});var t=await r.text(),d={};try{d=JSON.parse(t)}catch(z){}if(!r.ok)throw new Error(d.error||'Import impossible');toast('Importé : '+f.name)}catch(x){toast(x.message,true);break}}e.target.value='';await loadFiles(currentPath)})
function preview(x){var u='/api/download?path='+encodeURIComponent(x.path)+'&token='+encodeURIComponent(token);$('#previewName').textContent=x.name;var m=x.mime||'',h='';if(m.indexOf('image/')===0)h='<img src="'+u+'">';else if(m.indexOf('video/')===0)h='<video src="'+u+'" controls autoplay></video>';else if(m.indexOf('audio/')===0)h='<audio src="'+u+'" controls autoplay></audio>';else if(m==='application/pdf')h='<iframe src="'+u+'"></iframe>';else{location.href=u+'&download=1';return}$('#previewBody').innerHTML=h;$('#previewOverlay').classList.remove('hidden')}
function closePreview(){$('#previewOverlay').classList.add('hidden');$('#previewBody').innerHTML=''}
function openPasswordModal(){showModal('<h2>Changer le mot de passe</h2><form id="passForm"><label>Mot de passe actuel</label><input id="oldPass" type="password" required><label>Nouveau mot de passe</label><input id="nextPass" type="password" minlength="6" required><label>Confirmer</label><input id="nextPass2" type="password" minlength="6" required><button class="btn" style="width:100%" type="submit">Changer</button><div id="mmsg" class="msg"></div></form><div class="modal-actions" style="margin-top:10px"><button class="btn alt" onclick="closeModal()">Annuler</button></div>');$('#passForm').onsubmit=async function(e){e.preventDefault();var m=$('#mmsg');try{await post('/api/profile/password',{currentPassword:$('#oldPass').value,newPassword:$('#nextPass').value,confirm:$('#nextPass2').value});closeModal();toast('Mot de passe changé');setTimeout(logout,700)}catch(x){m.textContent=x.message;m.className='msg err'}}}
function formatSize(n){n=Number(n||0);if(n<1024)return n+' o';var u=['Ko','Mo','Go','To'],i=-1;do{n/=1024;i++}while(n>=1024&&i<u.length-1);return n.toFixed(n<10?1:0)+' '+u[i]}
restore();
</script>
</body></html>
